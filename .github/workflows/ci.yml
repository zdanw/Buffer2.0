name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Calendar API tests that create enabled tasks need APScheduler started so
      # Job.next_run_time exists (3.10.4 pin). TestClient skips FastAPI lifespan;
      # tests/api/test_calendar_routes.py starts the scheduler paused. Do not
      # ignore that file. Owner: remove the paused-start fixture if full_client
      # runs app lifespan. Do not upgrade APScheduler past 3.10.4 without
      # re-checking Job.next_run_time.
      - name: Pytest (API + unit)
        run: pytest -q --strict-markers

      - name: Docker production source is backend/
        working-directory: .
        run: python scripts/check_docker_production_source.py

  docker-root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Docker production source and build context
        run: python scripts/check_docker_production_source.py

      - name: Build root image without push
        run: docker build -t pulseforge-ci:local .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Typecheck + build
        run: npm run build
